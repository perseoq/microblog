{% if posts %}
    {% for post in posts %}
        <article>
            <h2><a href="{{ url_for('posts.detail', post_id=post.id) }}">{{ post.title }}</a></h2>
            <p class="meta">{{ post.date_posted.strftime('%d/%m/%Y') }} · {{ post.category.name }}</p>
            <p>{{ post.content|striptags|truncate(200, True, '…') }}</p>
        </article>
    {% endfor %}
{% else %}
    <p>{{ empty_message or 'No hay publicaciones.' }}</p>
{% endif %}
