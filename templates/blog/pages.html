{% extends 'base/base_blog.html' %}
{% block title %}{{ page.title }}{% endblock %}
{% block hero %}
<header class="page-heading">
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.date_posted.strftime('%d/%m/%Y') }}</p>
</header>
{% endblock %}
{% block content %}
<article class="page">
    <div class="content">{{ page.content|safe_html }}</div>
</article>
{% endblock %}
