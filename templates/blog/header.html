<header>
    <nav>
        <form action="{{ url_for('blog.search') }}" method="get" data-search-url="{{ url_for('blog.search_suggest') }}">
            <div class="search-field">
                <input type="search" name="q" placeholder="Buscar" value="{{ request.args.get('q', '') }}" autocomplete="off" aria-autocomplete="list" aria-expanded="false" data-search-input>
            </div>
        </form>
        <a href="{{ url_for('blog.index') }}">Inicio</a>
        {% if current_user.is_authenticated %}
            <a href="{{ url_for('gallery.manage') }}">Galería</a>
        {% endif %}
        {% if current_user.is_authenticated %}
            <span>{{ current_user.username }}</span>
            <a href="{{ url_for('admin.dashboard') }}">Panel</a>
            <a href="{{ url_for('auth.logout') }}">Salir</a>
        {% endif %}
    </nav>
</header>
