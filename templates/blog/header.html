<header>
    <a class="brand" href="{{ url_for('blog.index') }}">microblog</a>
    <nav>
        <a href="{{ url_for('blog.index') }}">Inicio</a>
        <a href="{{ url_for('gallery.index') }}">Galería</a>
        <form action="{{ url_for('blog.search') }}" method="get">
            <input type="search" name="q" placeholder="Buscar" value="{{ request.args.get('q', '') }}">
            <button type="submit">Buscar</button>
        </form>
        {% if current_user.is_authenticated %}
            <span>{{ current_user.username }}</span>
            <a href="{{ url_for('admin.dashboard') }}">Panel</a>
            <a href="{{ url_for('auth.logout') }}">Salir</a>
        {% else %}
            <a href="{{ url_for('auth.login') }}">Entrar</a>
        {% endif %}
        {% include 'base/theme_toggle.html' %}
    </nav>
</header>
