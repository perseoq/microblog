{% extends 'base/base_admin.html' %}
{% block title %}Temas{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1>Temas</h1>
        <p class="page-subtitle">Elige la paleta del blog. Afecta al modo claro y oscuro.</p>
    </div>
    <span class="status-badge is-on">Actual: {{ current_label }}</span>
</div>

<form method="post" class="themes-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="theme-grid">
        {% for theme in themes %}
            <label class="theme-card {% if theme.name == current %}is-active{% endif %}">
                <input type="radio" name="theme" value="{{ theme.name }}" {% if theme.name == current %}checked{% endif %}>
                <span class="theme-preview">
                    <span class="theme-swatch" style="background: {{ theme.light.paper }}; color: {{ theme.light.ink }};">
                        <span style="color: {{ theme.light.accent }};">Aa</span>
                    </span>
                    <span class="theme-swatch" style="background: {{ theme.dark.paper }}; color: {{ theme.dark.ink }};">
                        <span style="color: {{ theme.dark.accent }};">Aa</span>
                    </span>
                </span>
                <span class="theme-name">{{ theme.label }}</span>
            </label>
        {% endfor %}
    </div>
    <div class="form-actions">
        <button type="submit" class="button">Aplicar tema</button>
    </div>
</form>
{% endblock %}
